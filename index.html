<script>
const Q=[
{d:"Prompting & Task Execution",q:"A product manager wants Claude to write user stories from a raw feature request, but every attempt produces stories with inconsistent acceptance criteria depth: some have one bullet, others have ten. The team needs predictable, reviewable output for sprint planning. What is the best fix?",o:[
"Simply add the phrase 'be consistent' to the existing prompt and expect that this single added instruction, without any further specification of what consistency should actually look like in practice, will reliably narrow the current wide range in acceptance-criteria bullet counts.",
"Specify a fixed structure explicitly (title, one-sentence user story, exactly 3–5 acceptance criteria bullets, and one explicitly called-out edge case), and provide one fully worked example story following that exact structure before asking Claude to generate any new stories from raw feature requests.",
"Have the team manually rewrite every single generated story after the fact specifically to enforce a consistent number of acceptance criteria, treating this manual post-processing step as the primary and sufficient mechanism for achieving predictable output rather than changing the original request.",
"Generate ten separate variant versions of every single user story and have someone on the team manually select whichever one of the ten happens to have the most appropriately balanced level of acceptance-criteria detail for that particular story."
],a:1,e:"A concrete structural template (an explicit criteria-count range, a required edge case) combined with one fully worked example fixes the actual shape of the output directly; the vague instruction 'be consistent' does not specify what consistency actually means in practice. Manual rewriting after the fact and generating ten variants to pick from both shift the actual work back onto the team rather than solving the underlying specification gap."},
{d:"Prompting & Task Execution",q:"An analyst gives Claude a dense internal memo and asks it to 'pull out the important parts.' The resulting bullet list omits a budget risk the analyst considers critical but includes several minor operational notes. What does this scenario illustrate, and what is the fix?",o:[
"This shows that Claude is fundamentally unable to read and correctly interpret internal memos of this kind with any real accuracy, and a different tool entirely should be used for this specific type of document going forward.",
"The word 'important' was left entirely undefined and is inherently subjective, so the resulting selection reasonably reflects a plausible but ultimately different set of priorities than the analyst's own; specifying the actual dimensions that matter for this particular task (for example, explicitly naming budget, timeline, and staffing risks) will bring the model's selection into closer alignment with the analyst's real priorities.",
"The memo itself should be substantially shortened by the analyst personally before it is ever given to Claude, on the reasoning that pre-shortening the source material by hand is the most reliable way to ensure nothing genuinely important is ever missed by an automated summarization pass.",
"Ask Claude to list literally everything contained in the memo without any filtering or prioritization at all, on the reasoning that an entirely unfiltered, exhaustive list is functionally equivalent to a genuinely useful, prioritized summary of a dense memo."
],a:1,e:"Leaving 'important' undefined produces a plausible-sounding but ultimately subjective and potentially misaligned selection; naming the specific dimensions that actually matter (budget, timeline, staffing risk, etc.) closes the gap between what the analyst actually wanted flagged and what the model guessed. Manually pre-shortening the memo risks the analyst himself missing the risk before summarization even happens, and an exhaustive, entirely unfiltered list defeats the entire purpose of asking for a prioritized summary in the first place."},
{d:"Output Evaluation",q:"A pharmaceutical communications team asks Claude to summarize a clinical trial abstract for a general audience. The summary states the drug 'reduced symptoms in the majority of patients,' but the abstract's actual figure is 34% relative reduction, not a majority. What is the appropriate response?",o:[
"Accept the summary as written, on the reasoning that the phrase 'majority of patients' is a broadly reasonable, generally accessible paraphrase of what is overall a genuinely positive clinical trial result, even though the specific number involved does not literally describe a majority.",
"Treat this substitution as a meaningful and potentially misleading distortion of a specific clinical statistic rather than a harmless paraphrase; require that exact reported figures be preserved verbatim, or explicitly and clearly labeled as approximations where genuinely necessary, and have a qualified reviewer check every specific number in the summary against the original abstract before it is published to a general audience.",
"Ask Claude to rephrase the same underlying result using a different vague qualitative descriptor instead of 'majority,' such as 'many patients' or 'a substantial number,' rather than actually restoring or preserving the abstract's specific 34% figure in the final summary.",
"Conclude from this single incident that Claude should never again be used for clinical communications of any kind for this pharmaceutical team, regardless of what additional review or verification steps might otherwise be introduced into the process."
],a:1,e:"Replacing a precise, specific statistic (34% relative reduction) with a vague and factually inaccurate qualitative descriptor ('majority') can meaningfully mislead a general audience, particularly in a health context; the fix is preserving and verifying exact figures against the source, not swapping one imprecise phrase for another equally imprecise one, and not abandoning the tool entirely rather than adding the missing verification step."},
{d:"Output Evaluation",q:"A recruiter uses Claude to screen resumes and asks it to explain why each candidate was ranked as it was. The explanations are articulate and specific, citing skills and experience. Is this sufficient evidence that the ranking itself is fair and accurate?",o:[
"Yes, articulate and highly specific explanations that reference concrete skills and experience details are generally strong, sufficient evidence on their own that the underlying ranking logic producing those explanations is genuinely sound and free of problematic bias.",
"No — a fluent, specific-sounding explanation can be generated to justify a ranking regardless of whether the ranking itself is actually sound or fair, so the underlying screening process should be independently checked using representative test cases, the diversity of resulting outcomes should be reviewed for disparities, and a human should remain accountable for the final hiring decisions rather than deferring fully to the ranking or its explanations.",
"Yes, but only specifically when the accompanying explanations happen to also include explicit numeric scores alongside the qualitative reasoning, since the mere presence of a numeric component is what actually confers genuine evidentiary weight to an otherwise identical explanation.",
"No, and the appropriate conclusion is that resume screening should never involve any form of AI assistance whatsoever, rather than that the specific screening process here should be independently tested and reviewed."
],a:1,e:"Explanation fluency and specificity are not proof that the underlying ranking logic is actually sound or fair — a plausible-sounding justification can be generated regardless of the ranking's real quality. Independent testing against representative cases, review of outcome diversity, and retained human accountability for the final decision are what actually validate the process; the presence of a numeric score does not by itself add genuine evidentiary weight, and complete avoidance of AI assistance is not the only alternative to blindly trusting its explanations."},
{d:"Model & Feature Selection",q:"A small consultancy needs to generate first-draft slide decks from meeting notes for internal review, want the ability to keep editing the deck's layout and text visually afterward, and don't need it hosted publicly. Which capability fits best?",o:[
"Have Claude return a plain text response describing what slide content should go where, and have someone on the team then manually build the actual deck themselves in separate slide software, on the reasoning that a detailed text outline is functionally equivalent to an editable, ready-to-refine deck once the manual rebuilding step has been completed.",
"Use an Artifact (or equivalent dedicated output type) that produces an actual editable slide deck the team can retitle, rearrange, and refine themselves directly, rather than receiving only a flat text description of slide content that still needs to be manually rebuilt elsewhere into an actual deck.",
"Use a connector to their project-management tool, on the reasoning that a connector to an unrelated system generally provides useful supplementary functionality for slide-deck creation regardless of whether that specific tool has any actual deck-building capability.",
"Use a research-oriented capability, on the reasoning that a capability built for compiling and citing information from multiple sources is generally well-suited to any downstream task involving meeting notes, including turning them directly into a structured, editable slide deck."
],a:1,e:"A structured, genuinely editable output meant to be visually refined and kept afterward is exactly what a dedicated output type built for that purpose (an Artifact-style slide deck) is for; a plain text description still requires the actual rebuilding work to be done manually elsewhere, an unrelated project-management connector does not provide deck-building capability, and a research capability is built for sourced information lookup, not structured slide generation."},
{d:"Model & Feature Selection",q:"A university IT department is choosing between a lightweight, fast, inexpensive model tier and a more capable, slower, costlier tier to power a chatbot answering basic 'how do I reset my student portal password' questions during peak enrollment. What is the most defensible choice?",o:[
"Choose the costlier, more capable model tier by default for this entire chatbot, on the general reasoning that paying more for a more capable underlying model reliably yields a meaningfully better user experience across essentially any task, including simple, repetitive password-reset questions.",
"Choose the lightweight, fast, inexpensive tier for handling this simple, high-volume, genuinely low-risk task, while specifically reserving the more capable, costlier tier for any cases that get escalated because they are ambiguous or require deeper reasoning beyond a routine password reset.",
"Choose whichever tier the vendor happens to recommend as a general default, without factoring in the actual complexity, volume, or risk characteristics specific to this particular password-reset use case at all.",
"Conclude that this kind of basic support question should never be automated with any model tier at all, and that a chatbot handling password-reset questions should be avoided entirely regardless of the actual complexity or volume involved."
],a:1,e:"Matching model capability to actual task complexity avoids overpaying premium-tier cost for a simple, high-volume, genuinely low-risk task, while keeping a more capable tier available specifically for any cases that are escalated because they are ambiguous or need deeper reasoning. A blanket 'always choose the costlier tier' or 'follow the vendor default regardless of task' approach ignores the actual characteristics of this specific use case, and avoiding automation entirely discards a legitimate, low-risk efficiency opportunity."},
{d:"Workflow Integration",q:"An insurance company wants Claude to draft initial claim denial letters. Denials are high-stakes for customers and subject to regulatory appeal rights. Which workflow design best balances efficiency and responsibility?",o:[
"Fully automate the process so that denial letters are drafted by Claude and sent directly to customers without any human review step at all, in order to maximize processing speed and throughput for the claims department.",
"Have Claude draft the initial denial letter, including the specific denial reason and any required regulatory language regarding appeal rights, but require a licensed claims adjuster to actually review the draft, make any necessary edits, and formally approve it before the letter is ever sent to the customer.",
"Avoid using Claude for any part of the denial-letter process whatsoever, on the reasoning that anything related to claim denials is inherently too high-stakes and too regulated to benefit from any AI assistance at any stage, including purely first-draft generation intended for full human review.",
"Automate both the drafting and the sending of denial letters as before, but allow customers who are unhappy with a denial to request that a human specifically review their case only after they have already filed a formal complaint about the outcome."
],a:1,e:"High-stakes, regulated, appealable decisions like insurance claim denials call for a human — specifically a licensed adjuster — to review, edit if necessary, and formally approve each letter before it reaches the customer, rather than full automation with no gate or recourse limited to only after a complaint has already been filed. Avoiding AI assistance entirely, even for pure first-draft generation that a licensed adjuster will fully review anyway, discards a legitimate efficiency gain without addressing the actual risk, which lies specifically in the sending step."},
{d:"Workflow Integration",q:"A mid-size company automated its expense report categorization with Claude, achieving 95% accuracy against historical human-coded data in testing. Finance leadership wants to expand the same unreviewed automation to categorizing legal invoices for outside counsel, assuming similar accuracy will hold. What is the flaw in this reasoning?",o:[
"There is no actual flaw in this reasoning: a 95% accuracy rate validated on one categorization task is generally a reliable predictor of similarly high accuracy on essentially any other categorization task the same underlying model might be applied to, including a fairly different domain like legal invoices.",
"Accuracy validated on one specific task and data type (expense reports) does not automatically transfer to a genuinely different domain (legal invoices) with its own distinct categories, edge cases, and stakes; the new legal-invoice use case needs its own independent evaluation against trusted, human-verified labels before any reduction in review or oversight is justified for it.",
"The actual flaw is simply that 95% accuracy is not a high enough threshold to be considered acceptable for expense report categorization either, and the entire existing automated expense-categorization workflow itself should be reconsidered on that basis.",
"The actual flaw is that Claude is fundamentally incapable of reliably categorizing any type of financial or legal document at all, regardless of what accuracy figures were actually measured for the existing expense-report use case."
],a:1,e:"Validated accuracy on one task and data type does not automatically carry over to a materially different domain with its own distinct categories, edge cases, and stakes (legal invoices for outside counsel are meaningfully different from routine expense reports); the new use case needs its own independent evaluation against trusted labels before oversight can responsibly be reduced there. The 95% figure being 'not high enough' or the model being broadly incapable are not the actual flaws being described in this specific scenario."},
{d:"Configuration & Knowledge",q:"A multinational company's Claude project mixes knowledge documents in English, German and Japanese without labeling language or region-specific policy differences. Support staff in Japan have started receiving answers based on the German market's return policy. What is the most direct fix?",o:[
"Translate every single document in the project into English only, and remove the original German and Japanese language documents entirely from the knowledge base going forward.",
"Organize and clearly label the existing knowledge documents by both region and language, and add explicit instructions directing Claude to apply the policy that actually matches the customer's specific region, and to confirm with the user rather than silently guessing whenever a request is genuinely ambiguous about which region's policy should apply.",
"Instruct support staff based in Japan specifically to type the word 'Japan' explicitly as part of every single message they send, treating this per-message workaround as a complete and sufficient fix on its own with no other change to the underlying knowledge base.",
"Take no action at all and simply assume that this specific mismatch will naturally resolve itself over time as additional documents continue to be added to the shared, still-unlabeled multinational knowledge base."
],a:1,e:"Unlabeled, mixed-jurisdiction knowledge sitting together in one project invites exactly this kind of cross-contamination between regional policies; clearly labeling documents by region and language, combined with an explicit instruction to match the customer's actual region (and confirm rather than guess when genuinely ambiguous), addresses the root cause. Reducing to English-only documents discards needed regional content rather than fixing the labeling problem, a per-message workaround remains fragile and easy to forget, and doing nothing does not resolve an underlying labeling and instruction gap simply by adding more unlabeled documents over time."},
{d:"Configuration & Knowledge",q:"A startup gives Claude a connector with write access to its production database so it can 'fix data issues automatically' when asked. An engineer worries about irreversible changes from a misinterpreted request. What is the most appropriate safeguard?",o:[
"Remove the database connector entirely and forgo any AI assistance with data issues going forward, on the reasoning that any level of automated database interaction is inherently too unsafe to be worth the risk under any possible configuration.",
"Restrict the connector's actual access to read-only mode, or to a separate staging or sandbox database used specifically for exploration and generating proposed fixes, and require a human engineer to personally review and then manually apply any actual change intended for the real production database, rather than granting the connector direct production write access.",
"Keep the existing full production write access exactly as configured, but simply add an instruction asking Claude to 'be careful' whenever it is about to perform a potentially destructive database operation, treating that instruction as an adequate safeguard on its own.",
"Expand the connector's access to cover every database the company operates, not just the current production database, on the reasoning that giving the model broader overall context across more systems will reduce the chance of it misinterpreting any single request."
],a:1,e:"Restricting actual write capability to a staging or sandbox environment (or read-only mode) while requiring human review and manual application of any real production change directly addresses the specific risk described — an irreversible change resulting from a misinterpreted request — while still allowing the AI to help identify and propose fixes. Removing the connector entirely overcorrects, asking the model to 'be careful' is not an actual technical safeguard, and expanding access to additional databases increases rather than reduces the underlying risk."},
{d:"Configuration & Knowledge",q:"A legal team's Claude project instructions say 'Always be helpful and answer every question asked.' Staff have started asking it to draft contract clauses outside its knowledge base that conflict with firm policy on liability caps, and it complies fluently. What instruction change would most reduce this risk?",o:[
"Remove the existing project instructions entirely, on the reasoning that having no explicit instructions at all is generally a safer default than the current overly broad 'always be helpful' instruction that is currently causing the observed problem.",
"Add explicit scope boundaries directly into the instructions: specify which topics require citing the firm's actual approved clause library rather than drafting freely, define when the model should explicitly state that a request falls outside its approved scope, and specify when it should direct the user to consult an attorney rather than generating novel contract language on its own.",
"Leave the instructions completely unchanged, but simply tell staff members verbally to stop asking questions that fall outside the project's actual documented knowledge base, without making any corresponding change to the instructions themselves.",
"Add additional general language reinforcing the importance of being helpful and responsive to user questions, on the reasoning that reinforcing the existing helpfulness framing further will naturally cause the model to become more discerning about when helpfulness should have limits."
],a:1,e:"An unbounded 'always be helpful, answer everything' instruction places no actual constraint on scope, which is exactly what allows fluent drafting of clauses that conflict with firm policy; explicit boundaries and clear escalation conditions written directly into the instructions are what actually keep output aligned with policy. Removing instructions entirely, relying on a verbal staff reminder with no instruction change, or adding more generic helpfulness language all leave the actual scope gap unaddressed."},
{d:"Governance & Responsible Use",q:"A university uses Claude to help pre-screen research grant applications for basic completeness before human review, and a faculty member questions whether this disadvantages non-native English speakers due to phrasing. What is the most responsible way to evaluate this concern?",o:[
"Dismiss the faculty member's concern outright, on the reasoning that the screening tool is explicitly designed to check only for missing sections and required numeric fields rather than for writing quality, and that its stated design intent is therefore sufficient to rule out any actual disparate impact in practice.",
"Actually test the screening tool's outputs across a representative sample of applications from applicants with different linguistic backgrounds specifically to check for any disparate flagging rates, adjust the tool's underlying completeness criteria if a meaningful pattern does emerge from that testing, and continue to keep a human reviewer responsible for all final completeness decisions regardless of what the automated screen indicates.",
"Discontinue the pre-screening tool entirely and revert immediately to a fully manual completeness-check process, without first actually investigating whether the faculty member's specific concern about disparate impact is genuinely borne out by the tool's real screening outputs.",
"Ask Claude directly whether its own completeness-screening process is biased against non-native English speakers, and accept whatever answer it provides as sufficient evidence to either confirm or dismiss the faculty member's underlying concern."
],a:1,e:"A tool's stated design intention (checking only completeness, not writing quality) does not guarantee its actual real-world outcome is free of disparate impact; empirically testing the screening outputs across different applicant groups is the responsible way to actually check the concern, adjusting criteria if a pattern is found. Dismissing the concern outright, discontinuing the tool without investigating first, and accepting a self-report from the model as evidence all skip the actual empirical check that is needed here."},
{d:"Governance & Responsible Use",q:"An HR chatbot built on Claude tells an employee asking about a workplace harassment concern to 'just talk to your manager about it,' when the manager is actually the subject of the complaint, information the bot did not have access to. What does this reveal about deploying AI for sensitive workplace issues?",o:[
"The chatbot actually performed correctly in this instance, on the general reasoning that advising an employee to speak with their manager is broadly sound generic workplace advice applicable across the vast majority of typical employee situations and concerns.",
"Sensitive, high-stakes personal situations of this kind need clearly defined boundaries on what topics the AI should and should not offer specific advice on, a visible and reliable path to an actual human HR contact or an established formal reporting channel, and explicit design awareness that the AI genuinely lacks case-specific context (such as who exactly the complaint concerns) that it has no way to proactively ask about or verify on its own.",
"The employee themself should simply have provided the chatbot with more complete context about their specific situation before asking their question, and the resulting failure here is therefore primarily attributable to an incomplete initial question on the employee's part rather than to any underlying design gap.",
"This particular incident represents a genuinely rare, low-probability edge case that is not statistically significant enough to justify any specific additional design consideration or dedicated escalation-path work for this category of sensitive workplace chatbot interaction."
],a:1,e:"Generic advice offered by a system that structurally lacks case-specific context (here, that the manager is the actual subject of the complaint) can cause genuine harm in sensitive situations; the responsible fix is designing explicit scope limits on what the AI should advise on directly and a reliable human escalation path — not expecting the employee to have anticipated and pre-emptively filled a gap they may not have even realized existed, and not dismissing the pattern as too rare to design around."},
{d:"Troubleshooting & Optimization",q:"A team notices that a Claude-powered internal search tool gives excellent answers to questions phrased as complete sentences but poor or irrelevant answers to short keyword-style queries, which is how most employees actually search. What is the most effective response?",o:[
"Retrain employees company-wide to always type full, complete sentences whenever they use the internal search tool, with no other change made to the tool itself to address how it currently handles short keyword-style queries.",
"Explicitly test and tune the tool's handling of realistic query patterns — including the short keyword-style queries that most employees actually use in practice — as a formal part of its evaluation process, since the tool genuinely needs to perform well against how people actually query it in real usage, not merely against whatever phrasing style was originally used during its initial testing.",
"Conclude that the tool as a whole is fundamentally unfit for its intended purpose based on this specific gap, and discontinue the internal search tool entirely rather than adjusting its evaluation and tuning to better reflect actual usage patterns.",
"Add a brief note somewhere in the tool's interface apologizing to users for its currently weaker performance specifically on short keyword-style queries, without making any underlying change to how the tool actually processes or handles that query style."
],a:1,e:"Evaluating and tuning a tool only against a phrasing style that does not reflect how people actually use it will reliably miss real-world performance gaps that then surface after deployment; the fix is testing and tuning against actual realistic usage patterns, including the short keyword queries most employees genuinely use, rather than retraining users to change their behavior, discontinuing the tool outright, or merely acknowledging the gap in an interface note without addressing it."},
{d:"Troubleshooting & Optimization",q:"After three months in production, a Claude-based contract-review assistant's flagged-issue rate has quietly dropped from 18% of contracts to 4%, and the team assumes contract quality has improved. No one has re-run the original evaluation set. What is the most important next step?",o:[
"Celebrate the apparent improvement in flagged-issue rate as a clear success and proactively reduce the team's ongoing contract-review budget accordingly, on the assumption that a lower flag rate straightforwardly and reliably reflects genuinely improved underlying contract quality with no other possible explanation.",
"Re-run the original evaluation set (or a comparably rigorous updated one) against the current version of the assistant to actually confirm whether the observed drop genuinely reflects fewer real underlying issues in contracts, or instead reflects the assistant silently missing issues that it used to reliably catch, and investigate the specific cause of any unexplained shift found.",
"Assume that the observed drop in flagged-issue rate is most likely attributable to a general model quality improvement rolled out by Anthropic during the three-month period, and take no further investigative action on that assumption alone.",
"Simply increase the assistant's flagging threshold even further in order to reduce the number of false-positive flags even more, treating a further reduction in the flagged-issue rate as inherently desirable regardless of what is actually driving the already-observed drop."
],a:1,e:"An unexplained shift in a monitored quality metric like flagged-issue rate could genuinely reflect either real improvement in contract quality or silent degradation in the assistant's own detection capability, and re-running a stable, trusted evaluation set against the current system is what actually distinguishes between those two very different explanations, rather than assuming either one without checking, or further adjusting a threshold whose underlying cause remains unconfirmed."}
];

const PASS=72,SEC=900,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 4 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>Questions 46–60: 15 new scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 15 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 5.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
