<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Exam – Block 4</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6960;--bd:#e3e0d5;--ac:#c96442;--ok:#2e7d4f;--no:#b3392f;--sel:#fbeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.t.lo{color:var(--no)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.dm{color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:9px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.s{background:var(--sel);border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:rgba(46,125,79,.12)}.o.no{border-color:var(--no);background:rgba(179,57,47,.12)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.b:disabled{opacity:.4;cursor:default}
.r{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-size:56px;font-weight:800;text-align:center;margin:0}.c{text-align:center}
.star{font-size:96px;text-align:center;animation:sh 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes sh{0%,100%{transform:scale(1) rotate(-6deg);filter:drop-shadow(0 0 8px gold)}50%{transform:scale(1.18) rotate(6deg);filter:drop-shadow(0 0 28px gold)}}
.sp{position:fixed;font-size:22px;pointer-events:none;animation:fl 2.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
.ex{font-size:14.5px;color:var(--mu);border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.dr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.nav span{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;cursor:pointer}.nav .d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav .c2{outline:2px solid var(--tx)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{d:"Prompting & Task Execution",q:"A product manager wants Claude to write user stories from a raw feature request, but every attempt produces stories with inconsistent acceptance criteria depth: some have one bullet, others have ten. The team needs predictable, reviewable output for sprint planning. What is the best fix?",o:["Ask for 'consistent detail' in the next prompt and hope wording alone narrows the range.","Specify a fixed structure (title, user story sentence, exactly 3–5 acceptance criteria, one edge case) and provide one fully worked example story in that structure before asking for new ones.","Have the team rewrite every story manually after generation to enforce consistency.","Generate ten variants of each story and let the team pick the best one."],a:1,e:"A concrete structural template plus a worked example fixes the shape of the output; vague adjectives like 'consistent' do not specify a target, and generating many variants shifts the work rather than solving it."},
{d:"Prompting & Task Execution",q:"An analyst gives Claude a dense internal memo and asks it to 'pull out the important parts.' The resulting bullet list omits a budget risk the analyst considers critical but includes several minor operational notes. What does this scenario illustrate, and what is the fix?",o:["Claude cannot read memos accurately and a different tool should be used.","'Important' is undefined and subjective; the request should specify what counts as important for this task (e.g., budget, timeline, and staffing risks) so the model's selection matches the analyst's actual priorities.","The memo should be shortened by the analyst first so nothing can be missed.","Ask Claude to list absolutely everything, so nothing important is left out."],a:1,e:"Vague criteria produce a plausible but misaligned selection; naming the specific dimensions that matter closes the gap between the requester's intent and the model's guess. Listing everything defeats the purpose of a summary."},
{d:"Output Evaluation",q:"A pharmaceutical communications team asks Claude to summarize a clinical trial abstract for a general audience. The summary states the drug 'reduced symptoms in the majority of patients,' but the abstract's actual figure is 34% relative reduction, not a majority. What is the appropriate response?",o:["Accept it, since 'majority' is a reasonable paraphrase of a positive result.","Treat this as a meaningful distortion of a specific statistic; require exact figures be preserved or clearly stated as approximations, and have someone check every number against the abstract before publication.","Ask Claude to rephrase using different qualitative language instead of numbers.","Reject any use of Claude for clinical communications going forward."],a:1,e:"Vague words replacing precise statistics can materially mislead a reader, especially in health communications; the fix is verifying and preserving exact figures, not replacing one imprecise phrase with another."},
{d:"Output Evaluation",q:"A recruiter uses Claude to screen resumes and asks it to explain why each candidate was ranked as it was. The explanations are articulate and specific, citing skills and experience. Is this sufficient evidence that the ranking itself is fair and accurate?",o:["Yes, articulate, specific explanations are strong evidence the ranking logic is sound.","No; a fluent explanation can be generated for a ranking regardless of the ranking's actual soundness, so the process should be checked with test cases, diversity of outcomes reviewed, and a human should remain accountable for final decisions.","Yes, but only if the explanations mention numeric scores.","No, so resume screening should never involve any AI assistance."],a:1,e:"Explanation fluency is not proof of correct or fair underlying logic. Independent testing and outcome review, with human accountability retained, are needed; complete avoidance is not the only alternative to blind trust."},
{d:"Model & Feature Selection",q:"A small consultancy needs to generate first-draft slide decks from meeting notes for internal review, want the ability to keep editing the deck's layout and text visually afterward, and don't need it hosted publicly. Which capability fits best?",o:["A plain text response describing slide content, since decks can be built manually from an outline.","An Artifact or equivalent output type that produces an editable slide deck they can retitle, rearrange and refine themselves, rather than a flat text description.","A connector to their project management tool, which is unrelated to deck creation.","Research mode, since it is best suited for compiling meeting notes."],a:1,e:"Editable, structured outputs meant to be refined and kept are what dedicated output types like slide artifacts are for; plain text descriptions and unrelated connectors don't serve this need, and research mode is for sourced lookups, not deck generation."},
{d:"Model & Feature Selection",q:"A university IT department is choosing between a lightweight, fast, inexpensive model tier and a more capable, slower, costlier tier to power a chatbot answering basic 'how do I reset my student portal password' questions during peak enrollment. What is the most defensible choice?",o:["The costlier tier by default, since paying more always yields a better user experience.","The lightweight, fast tier, since the task is simple, high-volume, and low-risk, reserving the costlier tier for any escalated or ambiguous cases that need deeper reasoning.","Whichever tier the vendor recommends without regard to task complexity.","Neither; simple support questions should never be automated."],a:1,e:"Matching model capability to task complexity avoids overpaying for simple, high-volume, low-risk work while keeping a stronger tier available for genuinely harder cases."},
{d:"Workflow Integration",q:"An insurance company wants Claude to draft initial claim denial letters. Denials are high-stakes for customers and subject to regulatory appeal rights. Which workflow design best balances efficiency and responsibility?",o:["Fully automate sending denial letters directly to customers to speed up processing.","Have Claude draft the letter with the specific denial reason and required regulatory language, but require a licensed claims adjuster to review, edit if needed, and approve each letter before it is sent.","Skip AI entirely for any letter related to denials.","Automate drafting and sending, but allow customers to request a human review only after they file a complaint."],a:1,e:"High-stakes, regulated, appealable decisions call for human review and approval before an action reaches the customer, not full automation or after-the-fact recourse only. Avoiding AI entirely discards a legitimate drafting efficiency."},
{d:"Workflow Integration",q:"A mid-size company automated its expense report categorization with Claude, achieving 95% accuracy against historical human-coded data in testing. Finance leadership wants to expand the same unreviewed automation to categorizing legal invoices for outside counsel, assuming similar accuracy will hold. What is the flaw in this reasoning?",o:["There is no flaw; 95% accuracy on one task predicts similar accuracy on any other categorization task.","Accuracy validated on one task and data type does not transfer automatically to a different domain with different categories, edge cases and stakes; the new use case needs its own evaluation against trusted labels before scaling review down.","The flaw is that 95% is not a high enough accuracy for expense reports either.","The flaw is that Claude cannot categorize any financial documents reliably."],a:1,e:"Each new task and domain has its own error patterns and stakes; a validated accuracy rate in one context does not automatically justify reduced oversight in a different one without its own evaluation."},
{d:"Configuration & Knowledge",q:"A multinational company's Claude project mixes knowledge documents in English, German and Japanese without labeling language or region-specific policy differences. Support staff in Japan have started receiving answers based on the German market's return policy. What is the most direct fix?",o:["Translate all documents into English only and remove the others.","Organize and label knowledge documents by region and language, and add instructions directing Claude to apply the policy matching the customer's region, confirming ambiguous cases rather than guessing.","Ask staff in Japan to specify 'Japan' in every single message as the only fix needed.","Assume the issue will resolve itself as more documents are added."],a:1,e:"Unlabeled, mixed-jurisdiction knowledge invites cross-contamination; clear labeling and explicit region-matching instructions address the root cause more durably than per-message workarounds or reducing content diversity by deleting needed documents."},
{d:"Configuration & Knowledge",q:"A startup gives Claude a connector with write access to its production database so it can 'fix data issues automatically' when asked. An engineer worries about irreversible changes from a misinterpreted request. What is the most appropriate safeguard?",o:["Remove the connector entirely, since database automation is inherently unsafe.","Restrict the connector to read-only or a staging/sandbox database for exploration and proposed fixes, and require an engineer to review and apply any actual production change, rather than granting direct production write access.","Keep write access but ask Claude to 'be careful' with destructive operations.","Grant full access to all databases so Claude has enough context to avoid mistakes."],a:1,e:"Least privilege and human-approved application of changes address the actual risk (irreversible production writes) while still allowing the AI to help identify and propose fixes; being 'careful' is not a control, and broader access increases rather than reduces risk."},
{d:"Configuration & Knowledge",q:"A legal team's Claude project instructions say 'Always be helpful and answer every question asked.' Staff have started asking it to draft contract clauses outside its knowledge base that conflict with firm policy on liability caps, and it complies fluently. What instruction change would most reduce this risk?",o:["Remove the instructions entirely so Claude behaves by default.","Add explicit boundaries to the instructions: what topics require citing the firm's approved clause library, when to say a request is outside approved scope, and when to direct the user to an attorney rather than drafting freely.","Tell staff to stop asking questions outside the knowledge base, with no change to the instructions themselves.","Add more general helpfulness language to reinforce good answers."],a:1,e:"Unbounded 'always be helpful' instructions do not constrain scope; explicit boundaries and escalation conditions in the system instructions are what keep output aligned with firm policy."},
{d:"Governance & Responsible Use",q:"A university uses Claude to help pre-screen research grant applications for basic completeness before human review, and a faculty member questions whether this disadvantages non-native English speakers due to phrasing. What is the most responsible way to evaluate this concern?",o:["Dismiss it, since the tool only checks for missing sections and numbers, not writing quality.","Actually test the screening outputs across a sample of applications from different applicant groups to check for disparate flagging rates, adjust the check's criteria if a pattern emerges, and keep a human reviewing all final completeness decisions.","Stop pre-screening applications altogether without investigating the concern.", "Ask Claude directly whether its screening is biased and accept its answer."],a:1,e:"A stated design intention ('just checks completeness') doesn't guarantee the actual outcome is free of disparate impact; empirical testing across groups is the responsible way to check, and self-report from the model is not evidence."},
{d:"Governance & Responsible Use",q:"An HR chatbot built on Claude tells an employee asking about a workplace harassment concern to 'just talk to your manager about it,' when the manager is actually the subject of the complaint, information the bot did not have access to. What does this reveal about deploying AI for sensitive workplace issues?",o:["The bot performed correctly, since talking to a manager is generally good general advice.","Sensitive, high-stakes personal situations need clear boundaries on what the AI should and should not advise on, a visible path to a human HR contact or established reporting channel, and awareness that the AI lacks case-specific context it cannot ask for on its own.","The employee should have given the bot more context before asking.", "This is a rare edge case not worth designing around."],a:1,e:"Generic advice from a system lacking case-specific context can cause real harm in sensitive situations; the fix is designing clear scope limits and a reliable human escalation path, not expecting the employee to anticipate the gap."},
{d:"Troubleshooting & Optimization",q:"A team notices that a Claude-powered internal search tool gives excellent answers to questions phrased as complete sentences but poor or irrelevant answers to short keyword-style queries, which is how most employees actually search. What is the most effective response?",o:["Retrain employees to always type full sentences, with no other changes.", "Test and adjust the tool's handling of realistic query patterns (including short keyword queries) as part of its evaluation, since the tool must perform well on how users actually query it, not only on the phrasing that was originally tested.", "Conclude the tool is unfit for purpose and discontinue it.", "Add a note in the interface apologizing for short-query performance."],a:1,e:"An evaluation based on unrepresentative usage patterns will miss real-world performance gaps; the fix is testing and tuning against actual usage, not shifting the burden entirely to users or abandoning the tool."},
{d:"Troubleshooting & Optimization",q:"After three months in production, a Claude-based contract-review assistant's flagged-issue rate has quietly dropped from 18% of contracts to 4%, and the team assumes contract quality has improved. No one has re-run the original evaluation set. What is the most important next step?",o:["Celebrate the improvement and reduce the review budget accordingly.", "Re-run the original evaluation set (or an updated one) against the current system to confirm the drop reflects genuinely fewer issues rather than the assistant missing issues it used to catch, then investigate any unexplained change.", "Assume the drop is due to model improvements from Anthropic and take no action.", "Increase the flagging threshold further to reduce false positives even more."],a:1,e:"An unexplained shift in a monitored metric could reflect either real improvement or silent degradation in detection; ongoing evaluation against a stable benchmark is what distinguishes the two, rather than assuming either explanation."}
];
const PASS=72,SEC=3600,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 4 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>Questions 46–60: 15 new scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 60 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 5.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
